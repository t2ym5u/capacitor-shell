name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Config validation ────────────────────────────────────────────────────────
  check:
    name: Check project state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Validate default config
        run: node setup.js --check

      - name: Validate prod config
        run: node setup.js --check --config config.prod.json

